version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    container_name: angular_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always

  backend:
    build:
      context: ./backend/demo
    container_name: spring_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    restart: always
